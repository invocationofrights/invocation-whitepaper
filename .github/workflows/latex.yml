name: build-pdf
on:
  workflow_dispatch:       # manual trigger
  push:
    branches: [main]       # or your dev branch
jobs:
  latex:
    runs-on: ubuntu-latest          # free runner
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3   # 950-MB cached image
        with:
          root_file: main.tex
          latexmk_shell_escape: true     # if you use minted/TikZ externalize
      - uses: actions/upload-artifact@v4
        with:
          name: whitepaper
          path: main.pdf

