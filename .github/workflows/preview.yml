name: preview-build            # what you’ll see in the Actions tab

on:
  # Manual “Run workflow” button and `gh workflow run preview.yml`
  workflow_dispatch:

  # Rebuild PDF on every push to main  (remove these 3 lines if not needed)
  push:
    branches:
      - main

permissions:
  contents: read               # compile-only, no repo writes

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: Invocation_of_Rights.tex
          latexmk_shell_escape: true

      - uses: actions/upload-artifact@v4
        with:
          name: preview          # appears in Actions UI / gh run download
          path: Invocation_of_Rights.pdf
