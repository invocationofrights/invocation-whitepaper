name: preview-build            # shows in Actions UI

on:
  workflow_dispatch:           # manual button, still handy
  push:
    branches-ignore:           # build every branch EXCEPT main
      - main

permissions:
  contents: read               # compile-only, no writes

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true     # auto-cancel older preview runs on same branch

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: Invocation_of_Rights.tex
          latexmk_shell_escape: true

      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: Invocation_of_Rights.pdf
